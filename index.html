<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmrFlex Secure Escrow - Premium Marketplace</title>
    <link rel="icon" type="image/jpeg" href="ICONE.jpeg">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0b0f;
            color: #f3f4f6;
        }
        .royal-gold-border {
            border-color: rgba(212, 175, 55, 0.3);
        }
        .royal-gold-text {
            color: #d4af37;
        }
        .royal-gold-btn {
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            color: #000;
        }
        .royal-gold-btn:hover {
            background: linear-gradient(135deg, #e6c555, #c2911b);
        }
        .royal-card {
            background: rgba(18, 18, 24, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
    </style>
</head>
<body class="font-sans min-h-screen selection:bg-amber-500 selection:text-black flex flex-col justify-between">

    <div>
        <header class="bg-black/90 backdrop-blur-md border-b royal-gold-border sticky top-0 z-40 shadow-2xl">
            <div class="container mx-auto px-4 py-3.5 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved royal-gold-text text-lg"></i>
                    <span class="royal-gold-text font-black text-sm tracking-wider">AMRFLEX ESCROW</span>
                </div>
                
                <div class="flex items-center gap-2.5">
                    <button onclick="switchTab('buy')" id="buyTabBtn" class="royal-gold-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition cursor-pointer shadow flex items-center gap-2">
                        <i class="fa-solid fa-cart-shopping"></i> Buy Account
                    </button>
                    <button onclick="openSellModal()" class="royal-card hover:bg-slate-800 royal-gold-text px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition cursor-pointer royal-gold-border border flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle"></i> Sell Account
                    </button>
                </div>
            </div>
        </header>

        <main class="container mx-auto px-4 py-6 sm:py-8 max-w-7xl">
            
            <div class="royal-card rounded-2xl overflow-hidden mb-8 shadow-2xl border royal-gold-border relative">
                <div class="h-56 sm:h-72 w-full relative bg-black">
                    <img src="file_00000000757c81f4b0372497a010d720.jpeg" alt="Royal Platform Banner" class="w-full h-full object-cover object-[center_12%] opacity-95">
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-transparent flex flex-col justify-end p-6">
                        <h2 class="text-lg sm:text-2xl font-black royal-gold-text mb-1 flex items-center gap-2">
                            <i class="fa-solid fa-crown"></i> Secure Account Marketplace & Escrow
                        </h2>
                        <p class="text-slate-300 text-xs sm:text-sm">Browse verified accounts for sale or list your own asset securely with AmrFlex.</p>
                    </div>
                </div>
            </div>

            <div class="flex justify-center gap-2.5 mb-8 flex-wrap">
                <button onclick="filterPlatform('all')" class="platform-filter active royal-gold-btn px-4 py-2 rounded-xl text-xs font-bold transition cursor-pointer shadow">All Platforms</button>
                <button onclick="filterPlatform('instagram')" class="platform-filter royal-card hover:bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-xs font-semibold transition cursor-pointer royal-gold-border border"><i class="fa-brands fa-instagram ml-1 text-pink-500"></i> Instagram</button>
                <button onclick="filterPlatform('tiktok')" class="platform-filter royal-card hover:bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-xs font-semibold transition cursor-pointer royal-gold-border border"><i class="fa-brands fa-tiktok ml-1 text-cyan-400"></i> TikTok</button>
                <button onclick="filterPlatform('facebook')" class="platform-filter royal-card hover:bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-xs font-semibold transition cursor-pointer royal-gold-border border"><i class="fa-brands fa-facebook ml-1 text-blue-500"></i> Facebook</button>
            </div>

            <div id="accountsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6">
                </div>
        </main>
    </div>

    <footer class="bg-black/90 border-t royal-gold-border py-6 mt-12 text-xs text-slate-400">
        <div class="container mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4 text-center md:text-right">
            <p>&copy; 2026 AmrFlex Market. All rights reserved.</p>
            
            <div class="flex items-center justify-center gap-2">
                <span class="text-slate-300 font-medium">Customer Support:</span>
                <a href="https://wa.me/201013487785?text=Hello%20Admin,%20I%20need%20support." target="_blank" class="royal-gold-text font-bold hover:underline flex items-center gap-1.5 bg-amber-500/10 px-3 py-1.5 rounded-lg border royal-gold-border">
                    <i class="fa-brands fa-whatsapp text-emerald-400 text-sm"></i> Contact via WhatsApp
                </a>
            </div>

            <p class="royal-gold-text font-bold tracking-wide">Designed & Developed by AmrFlex VIP Systems</p>
        </div>
    </footer>

    <div id="sellModal" class="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center hidden z-50 p-4 overflow-y-auto">
        <div class="royal-card rounded-2xl p-5 sm:p-6 w-full max-w-md shadow-2xl relative my-auto royal-gold-border border">
            <div class="flex justify-between items-center mb-4 border-b royal-gold-border pb-3">
                <h3 class="text-base sm:text-lg font-bold royal-gold-text">List Your Account for Sale</h3>
                <button onclick="closeSellModal()" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="sellAccountForm" onsubmit="handleSellSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Platform</label>
                    <select id="platform" class="w-full bg-black border royal-gold-border rounded-xl p-3 text-xs sm:text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                        <option value="instagram">Instagram</option>
                        <option value="tiktok">TikTok</option>
                        <option value="facebook">Facebook</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Account Proof / Screenshot</label>
                    <input type="file" id="accountImage" accept="image/*" class="w-full bg-black border royal-gold-border rounded-xl p-2 text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-amber-500 file:text-black hover:file:bg-amber-400 cursor-pointer">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Account Details & Metrics</label>
                    <input type="text" id="details" required placeholder="e.g., 25k Followers, High engagement" class="w-full bg-black border royal-gold-border rounded-xl p-3 text-xs sm:text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Price</label>
                    <input type="text" id="price" required placeholder="e.g., 2,500 EGP" class="w-full bg-black border royal-gold-border rounded-xl p-3 text-xs sm:text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Owner WhatsApp Number</label>
                    <input type="tel" id="sellerPhone" required placeholder="e.g., 201234567890" class="w-full bg-black border royal-gold-border rounded-xl p-3 text-xs sm:text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t royal-gold-border">
                    <button type="button" onclick="closeSellModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-4 py-2.5 rounded-xl transition cursor-pointer font-medium">Cancel</button>
                    <button type="submit" class="royal-gold-btn text-xs px-5 py-2.5 rounded-xl transition cursor-pointer font-bold shadow">Submit Listing</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const MY_ADMIN_WHATSAPP = "201013487785"; 

        // الـ 3 إعلانات الافتراضية الخاصة بقسم الشراء (Buy Account)
        let buyAccounts = [
            { id: 1, platform: 'instagram', image: '', details: 'حساب انستجرام مميز - 25,000 متابع حقيقي، تفاعل قوي ونظيف', price: '2,500 EGP', sellerPhone: '201111111111' },
            { id: 2, platform: 'tiktok', image: '', details: 'حساب تيك توك تريند - 100,000 متابع، ريتش عالي وجاهز للبثوث والأرباح', price: '5,500 EGP', sellerPhone: '201222222222' },
            { id: 3, platform: 'facebook', image: '', details: 'بيج فيسبوك موثق أو قديم - 20,000 إعجاب، بدون مخالفات نهائياً', price: '2,000 EGP', sellerPhone: '201333333333' }
        ];

        let currentPlatformFilter = 'all';

        window.onload = function() {
            displayAccounts(buyAccounts);
        }

        function displayAccounts(data) {
            const grid = document.getElementById('accountsGrid');
            grid.innerHTML = '';

            let filtered = data;
            if (currentPlatformFilter !== 'all') {
                filtered = data.filter(acc => acc.platform === currentPlatformFilter);
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-12 text-sm">No active listings found in this category.</p>`;
                return;
            }

            filtered.forEach(acc => {
                let iconClass = '';
                let badgeColor = '';
                let platformName = '';
                let platformBgIcon = '';

                if(acc.platform === 'instagram') {
                    iconClass = 'fa-brands fa-instagram text-pink-500';
                    badgeColor = 'bg-pink-500/10 text-pink-400 border-pink-500/20';
                    platformName = 'Instagram';
                    platformBgIcon = 'fa-brands fa-instagram text-pink-500/40 text-6xl';
                } else if(acc.platform === 'tiktok') {
                    iconClass = 'fa-brands fa-tiktok text-cyan-400';
                    badgeColor = 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20';
                    platformName = 'TikTok';
                    platformBgIcon = 'fa-brands fa-tiktok text-cyan-400/40 text-6xl';
                } else {
                    iconClass = 'fa-brands fa-facebook text-blue-500';
                    badgeColor = 'bg-blue-500/10 text-blue-400 border-blue-500/20';
                    platformName = 'Facebook';
                    platformBgIcon = 'fa-brands fa-facebook text-blue-500/40 text-6xl';
                }

                let imageContent = '';
                if(acc.image) {
                    imageContent = `<img src="${acc.image}" alt="Listing Preview" class="w-full h-full object-cover">`;
                } else {
                    imageContent = `<div class="w-full h-full flex items-center justify-center bg-black/60"><i class="${platformBgIcon}"></i></div>`;
                }

                let messageText = `Hello Admin, I want to purchase this account through Escrow:\n\n- Platform: ${platformName}\n- Details: ${acc.details}\n- Price: ${acc.price}\n- Seller Phone: ${acc.sellerPhone}\n\nPlease proceed with transaction verification.`;
                let encodedMessage = encodeURIComponent(messageText);
                let whatsappLink = `https://wa.me/${MY_ADMIN_WHATSAPP}?text=${encodedMessage}`;

                grid.innerHTML += `
                    <div class="royal-card rounded-2xl overflow-hidden shadow-xl flex flex-col justify-between transition hover:border-amber-500/50">
                        <div>
                            <div class="h-40 sm:h-44 bg-slate-950 overflow-hidden relative border-b royal-gold-border">
                                ${imageContent}
                            </div>
                            <div class="p-4 sm:p-5">
                                <div class="flex justify-between items-center mb-3">
                                    <span class="px-3 py-1 rounded-lg text-xs font-semibold border ${badgeColor}">
                                        <i class="${iconClass} ml-1"></i> ${platformName}
                                    </span>
                                    <span class="royal-gold-text font-black text-sm sm:text-base tracking-wide">${acc.price}</span>
                                </div>
                                <p class="text-slate-300 text-xs sm:text-sm leading-relaxed mb-4">${acc.details}</p>
                            </div>
                        </div>
                        <div class="p-4 sm:p-5 pt-0">
                            <a href="${whatsappLink}" target="_blank" class="w-full royal-gold-btn text-xs sm:text-sm py-3 rounded-xl flex items-center justify-center gap-2 transition font-black shadow-md cursor-pointer">
                                <i class="fa-solid fa-cart-shopping text-sm"></i> Buy via Admin
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        function filterPlatform(platform) {
            currentPlatformFilter = platform;
            document.querySelectorAll('.platform-filter').forEach(btn => {
                btn.classList.remove('royal-gold-btn', 'text-black');
                btn.classList.add('royal-card', 'text-slate-300', 'border', 'royal-gold-border');
            });
            event.currentTarget.classList.remove('royal-card', 'text-slate-300', 'border', 'royal-gold-border');
            event.currentTarget.classList.add('royal-gold-btn', 'text-black');

            displayAccounts(buyAccounts);
        }

        function switchTab(tab) {
            if (tab === 'buy') {
                displayAccounts(buyAccounts);
            }
        }

        function openSellModal() {
            document.getElementById('sellModal').classList.remove('hidden');
        }
        function closeSellModal() {
            document.getElementById('sellModal').classList.add('hidden');
        }

        function handleSellSubmit(event) {
            event.preventDefault();
            
            const imageInput = document.getElementById('accountImage');
            let imageUrl = '';

            if (imageInput.files && imageInput.files[0]) {
                imageUrl = URL.createObjectURL(imageInput.files[0]);
            }

            const newAcc = {
                id: buyAccounts.length + 1,
                platform: document.getElementById('platform').value,
                image: imageUrl,
                details: document.getElementById('details').value,
                price: document.getElementById('price').value,
                sellerPhone: document.getElementById('sellerPhone').value
            };

            buyAccounts.unshift(newAcc);
            displayAccounts(buyAccounts);
            
            document.getElementById('sellAccountForm').reset();
            closeSellModal();
        }
    </script>
</body>
</html>
